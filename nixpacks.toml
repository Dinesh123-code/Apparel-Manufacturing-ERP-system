[phases.setup]
nixPkgs = ["php82", "php82Extensions.gd", "php82Extensions.zip", "composer", "nodejs_20"]

[phases.build]
cmds = [
  "composer install --optimize-autoloader --no-interaction --ignore-platform-req=ext-gd",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan migrate --force --seed && php artisan serve --host=0.0.0.0 --port=$PORT"
